# -- general -------------------------------------------------------------------

set  -g default-terminal "tmux-256color"
setw -g mode-keys        vi
set  -g mouse            on
set  -s escape-time      10
set  -sg repeat-time     250
set  -s focus-events     on
set  -g history-limit    100000
set  -g set-clipboard    on

# pass cursor shape/blink (DECSCUSR) through to the outer terminal
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g  cursor-style       blinking-block

# Don't corrupt paste
# set -s extended-keys off
setw -g xterm-keys on

# Prefix key
unbind C-b
set  -g   prefix S-F1
set  -g   prefix2 `
bind S-F1 send-prefix
bind `    send-prefix -2

# Reload
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- display -------------------------------------------------------------------
set  -g set-titles-string '#h ❐ #S ● #I #W'
set  -g base-index 1          # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows
setw -g automatic-rename on   # rename window to reflect current program
set  -g renumber-windows on   # renumber windows when a window is closed
set  -g set-titles on         # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time
set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off

# -- navigation ----------------------------------------------------------------

# session navigation
bind BTab switch-client -l  # move to last session

# splits + new window
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind 'c' new-window      -c '#{pane_current_path}'

# pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind    > swap-pane -D
bind    < swap-pane -U

# pane resize
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# zoom
bind + resize-pane -Z

# window navigation
unbind n
unbind p
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

# toggle mouse
bind m if -F '#{mouse}' 'set -g mouse off ; display "mouse: off"' 'set -g mouse on ; display "mouse: on"'

# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode # enter copy mode
bind -T copy-mode-vi v                 send -X begin-selection
bind -T copy-mode-vi C-v               send -X rectangle-toggle
bind -T copy-mode-vi y                 send -X copy-pipe-no-clear 'pbcopy'
bind -T copy-mode-vi Escape            send -X cancel
bind -T copy-mode-vi H                 send -X top-line
bind -T copy-mode-vi M                 send -X middle-line
bind -T copy-mode-vi L                 send -X bottom-line
bind -T copy-mode-vi 0                 send -X start-of-line
bind -T copy-mode-vi $                 send -X end-of-line
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear 'pbcopy'
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send -x select-word \; send -x copy-pipe-no-clear 'pbcopy'
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send -x select-line \; send -x copy-pipe-no-clear 'pbcopy'
bind -T root         DoubleClick1Pane  if -Ft= '#{pane_in_mode}' '' 'select-pane ; copy-mode -M ; send-keys -x select-word ; send -x copy-pipe-no-clear pbcopy'
bind -T root         TripleClick1Pane  if -Ft= '#{pane_in_mode}' '' 'select-pane ; copy-mode -M ; send-keys -x select-line ; send -x copy-pipe-no-clear pbcopy'
bind y run -b 'tumx save-buffer - | pbcopy'

# -- buffers -------------------------------------------------------------------

bind b list-buffers  # list paste buffers
bind p paste-buffer  # paste from the top paste buffer
bind P choose-buffer # choose which buffer to paste from

# -- pickers -------------------------------------------------------------------

bind U capture-pane -J -S -10000 \; save-buffer /tmp/tmux-urlview \; display-popup -E -w 90% -h 80% 'urlview /tmp/tmux-urlview ; rm -f /tmp/tmux-urlview'
bind F capture-pane -J -S -10000 \; save-buffer /tmp/tmux-fpp     \; display-popup -E -w 90% -h 80% 'fpp < /tmp/tmux-fpp ; rm -f /tmp/tmux-fpp'
bind Y capture-pane -J -S -10000 \; save-buffer /tmp/tmux-fpp     \; display-popup -E -w 90% -h 80% 'fpp -c fpp-copy < /tmp/tmux-fpp ; rm -f /tmp/tmux-fpp'

# -- theme ---------------------------------------------------------------------

set -g status-position top
set -g status-justify  left

set -g status-style          fg='#8a8a8a',bg='#080808'
set -g message-style         fg='#000000',bg='#ffff00',bold
set -g message-command-style fg='#ffff00',bg='#000000',bold
set -g mode-style            fg='#000000',bg='#ffff00',bold

set -g pane-border-style           fg='#444444'
set -g pane-active-border-style    fg='#00afff'
set -g display-panes-colour        fg='#00afff'
set -g display-panes-active-colour fg='#00afff'

set -g window-status-separator      ''
set -g window-status-style          fg='#8a8a8a',bg='#080808'
set -g window-status-current-style  fg='#000000',bg='#00afff',bold
set -g window-status-activity-style underscore
set -g window-status-bell-style     fg='#ffff00',blink,bold
set -g window-status-last-style     fg='#00afff'
set -g window-status-format         ' #I|#{pane_current_command}❯#{b:pane_current_path} '
set -g window-status-current-format '#[fg=#00afff,bg=#080808]▶#[fg=#000000,bg=#00afff,bold] #I|#{pane_current_command}❯#{b:pane_current_path} #[fg=080808,bg=#00afff,nobold]▶'

set -g clock-mode-colour '#00afff'
set -g clock-mode-style  24

# status-left: yellow session segment + powerline transition
set -g status-left-length 100
set -g status-left '#[fg=#000000,bg=#ffff00,bold] ❐ #S #[fg=#ffff00,bg=#080808,nobold]▶'

# status-right: prefix/pairing - battery - time - date | user | host
set -g status-right-length 200
set -g status-right '#{?client_prefix,⌨ ,}#{?session_many_attached,⚇ ,}#(pmset -g batt 2>/dev/null | grep -q discharging && echo ◼ || echo ◻) #(pmset -g batt 2>/dev/null | grep -Eo "[0-9]+%" | head -1) | %R | %d %b #[fg=#d700000,bg=#080808]◀#[fg=#e4e4e4,bg=#d700000] #(whomai) #[fg=#e4e4e4,bg=#d700000]◀#[fg=#000000,bg=#e4e4e4,bold] #h '
